        - grades
      properties:
        grades:
          type: array
          items:
            $ref: '#/components/schemas/GradeSessionEntry'
        absences:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - studentId
              - motif
            properties:
              studentId:
                type: string
                format: uuid
              motif:
                type: string
                minLength: 1
    SubjectBreakdown:
      type: object
      description: Every grade is the grade out of 20 multiplied by the coefficient of the subject. A missing grade is null and is not counted in the average.
      properties:
        subjectId:
          type: string
          format: uuid
        subjectName:
          type: string
        coefficient:
          type: number
        term1SemiTrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        term1TrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        term2SemiTrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        term2TrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        term3SemiTrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        term3TrimesterGrade:
          type: number
          nullable: true
          minimum: 0
        subjectOverallAverage:
          type: number
          nullable: true
          minimum: 0
    AnnualResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        classGroup:
          $ref: '#/components/schemas/ClassGroup'
        academicYear:
          type: string
        status:
          $ref: '#/components/schemas/ResultStatus'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectBreakdown'
        totalCoefficients:
          type: number
        overallAverage:
          type: number
          description: Out of 20
        decision:
          $ref: '#/components/schemas/AcademicDecision'
        classRank:
          type: integer
          nullable: true
        createdBySecretaryId:
          type: string
          format: uuid
        approvedByAdminId:
          type: string
          format: uuid
          nullable: true
        pdfExportUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateResultRequest:
      type: object
      additionalProperties: false
      required:
        - studentId
        - classGroup
        - academicYear
        - subjects
        - totalCoefficients
        - overallAverage
      properties:
        studentId:
          type: string
          format: uuid
        classGroup:
          $ref: '#/components/schemas/ClassGroup'
        academicYear:
          type: string
          pattern: ^\d{4}-\d{4}$
        status:
          $ref: '#/components/schemas/ResultStatus'
          default: DRAFT
        subjects:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - subjectId
              - subjectName
              - coefficient
            properties:
              subjectId:
                type: string
                format: uuid
              subjectName:
                type: string
              coefficient:
                type: number
                minimum: 0.1
              term1SemiTrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              term1TrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              term2SemiTrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              term2TrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              term3SemiTrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              term3TrimesterGrade:
                type: number
                nullable: true
                minimum: 0
              subjectOverallAverage:
                type: number
                nullable: true
                minimum: 0
        totalCoefficients:
          type: number
          minimum: 0.1
        overallAverage:
          type: number
          minimum: 0
        decision:
          $ref: '#/components/schemas/AcademicDecision'
          default: PENDING
        classRank:
          type: integer
          minimum: 1
    ReviewResultRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/ResultStatus'
        decision:
          $ref: '#/components/schemas/AcademicDecision'
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        results:
          type: integer
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - fail
            - error
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
