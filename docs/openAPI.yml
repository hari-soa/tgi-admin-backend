        - PREMIERE
        - TERMINALE
        - ANCIEN
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
    ExamType:
      type: string
      enum:
        - SEMI_TRIMESTER
        - TRIMESTER
    Term:
      type: string
      enum:
        - FIRST_TRIMESTER
        - SECOND_TRIMESTER
        - THIRD_TRIMESTER
    GradeStatus:
      type: string
      enum:
        - DRAFT
        - PENDING
        - PUBLISHED
    GradeSessionStatus:
      type: string
      enum:
        - OPEN
        - PENDING_REVIEW
        - VALIDATED
    ResultStatus:
      type: string
      enum:
        - DRAFT
        - APPROVED
        - PUBLISHED
    AcademicDecision:
      type: string
      enum:
        - PROMOTE
        - REPEAT
        - ORIENTED
        - PENDING
    HistoryType:
      type: string
      enum:
        - ABSENCE
        - LATENESS
        - SUSPENSION
        - INFIRMARY
        - EARLY_LEAVE_PERMIT
    RemarkCategory:
      type: string
      enum:
        - BEHAVIOR
        - ACADEMIC
        - WARNING
        - ENCOURAGEMENT
        - OTHER
    DayOfWeek:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
    TargetScope:
      type: string
      enum:
