openapi: 3.0.3
info:
  title: TGI Admin API
  version: 3.0.0
  description: |-
    REST API of the TGI school administration application.

    **Single source of truth** – this document drives the server (routing by `operationId`, bearer authentication, role control with `x-roles`, request validation) and the frontend (path, method and parameters of every operation are read from `GET /api/v1/spec`). There is no separate route file.

    **Authentication** – every operation except `login` and `getApiSpecification` requires `Authorization: Bearer <token>`. The login credentials are the account **email** and the **matricule**.

    **Responses** – successful responses look like `{ "status": "success", "message"?: string, "results"?: number, "data": { ... } }`. Errors look like `{ "status": "fail" | "error", "message": string, "errors"?: [...] }`.

    **Roles** – `ADMIN`, `SECRETARY`, `TEACHER`, `STUDENT`. The roles allowed on an operation are listed in `x-roles`.

    **Super administrator** – only the super administrator can read, update or reach his own account. Nobody can delete it.

    **Grade workflow** – the admin opens a grade session, the secretary fills and submits it (grades are out of 20, a missing grade means the student is absent), the admin can correct the submitted grades then validates the session: grades are published and each report card is recomputed with the coefficients of the subjects.
servers:
  - url: /api/v1
    description: Current server
tags:
  - name: Specification
  - name: Auth
  - name: Users
  - name: Subjects
  - name: Announcements
  - name: Disciplinary
  - name: Attendance
  - name: Grades
  - name: Results
security:
  - bearerAuth: []
paths:
  /spec:
    get:
      tags:
        - Specification
      operationId: getApiSpecification
      summary: OpenAPI specification of this API, as JSON
      description: The frontend reads this document to find the path, the method and the parameters of every operation from its operationId.
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Log in with email and matricule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/LoginUser'
                      redirectUrl:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getAuthenticatedUser
      summary: Profile of the authenticated user
      x-roles:
        - ADMIN
        - SECRETARY
        - TEACHER
        - STUDENT
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List users
      description: The super administrator is only listed to the super administrator.
      x-roles:
        - ADMIN
        - SECRETARY
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: classGroup
          in: query
          schema:
            $ref: '#/components/schemas/ClassGroup'
        - name: search
          in: query
          description: Matches first name, last name, email or matricule
          schema:
            type: string
